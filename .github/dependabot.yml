# Dependabot keeps SIC Connect's dependencies patched.
# It checks once a week and opens pull requests; each one must pass the CI checks
# ("Backend (.NET 8)" and "Frontend (React)") before the "Protect main" ruleset lets it merge.
#
# Only minor and patch updates are proposed automatically. Major upgrades (React 19,
# Vite 8, ESLint 10, Swashbuckle 10, ...) change APIs and need a planned migration, so
# they are done by hand; security fixes for the current versions still arrive as patches.
#
# Also turn on, in Settings -> Advanced Security: "Dependabot alerts" and "Dependabot security updates".

version: 2
updates:
  # Frontend: React + Vite (npm)
  - package-ecosystem: "npm"
    directory: "/frontend/sic-connect-web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps(frontend)"
    groups:
      # Bundle routine minor and patch upgrades into one PR; major upgrades still get their own PR.
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      frontend-security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades are planned migrations, not automatic bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.5+ requires ESLint 9; the project is on ESLint 8. Remove when upgrading ESLint.
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">=0.5.0"]

  # Backend: ASP.NET Core Web API (NuGet)
  - package-ecosystem: "nuget"
    directory: "/backend/SicConnect.Api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      backend-security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades are planned migrations, not automatic bumps. In particular the
      # Microsoft.AspNetCore.* and Microsoft.EntityFrameworkCore* packages follow the .NET
      # version: the API targets .NET 8, so their next majors (built for .NET 9+) would not
      # install. 8.0.x patches, including security fixes, still come through.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the workflows (also clears "Node.js deprecated" warnings over time)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(ci)"
    groups:
      github-actions:
        patterns: ["*"]
