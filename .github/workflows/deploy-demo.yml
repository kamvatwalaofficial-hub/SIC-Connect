# Builds the static, backend-free demo of the frontend and publishes it to GitHub Pages
# at https://kamvatwala.com/SIC-Connect/ (the account's custom domain).
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Deploy live demo

on:
  push:
    branches: [main]
    paths:
      - 'frontend/sic-connect-web/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

# Least privilege: read the code, publish to Pages, and prove the deployment's identity.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sic-connect-web
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/sic-connect-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Test the demo API
        run: npm run test:demo

      - name: Build the demo
        run: npm run build:demo

      # GitHub Pages serves 404.html for unknown paths, which lets deep links such as
      # /SIC-Connect/events load the single-page app instead of a Pages error.
      - name: Add single-page app fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/sic-connect-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
