# Continuous integration: builds and checks both halves of SIC Connect on every pull request
# (including Dependabot's) and on every push to main, so dependency upgrades are tested before merging.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow never needs to change the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/SicConnect.Api
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check NuGet packages for known vulnerabilities
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE "\b(High|Critical)\b" vulnerable.txt; then
            echo "::error::High or critical vulnerabilities found in NuGet packages."
            exit 1
          fi

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sic-connect-web
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/sic-connect-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Test the demo API
        run: npm run test:demo

      - name: Build the app
        run: npm run build

      - name: Build the demo
        run: npm run build:demo
